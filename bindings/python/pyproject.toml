[project]
name = "amd-platform-catalog"
version = "0.1.0"
description = "Thin Python binding over the AMD Platform Catalog (embedded, no subprocess/live fetch)"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amd_platform_catalog"]

[tool.hatch.build.targets.wheel.force-include]
"src/amd_platform_catalog/catalog.json" = "amd_platform_catalog/catalog.json"

[tool.uv]
package = true
