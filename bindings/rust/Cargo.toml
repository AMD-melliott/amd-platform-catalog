[package]
name = "amd-platform-catalog"
version = "0.1.0"
edition = "2021"
description = "Thin Rust binding over the AMD Platform Catalog (embedded, no FFI/subprocess)"
license = "MIT"

[lib]
name = "amd_platform_catalog"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
