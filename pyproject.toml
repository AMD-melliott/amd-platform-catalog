[project]
name = "amd-platform-catalog"
version = "0.1.0"
description = "Versioned, cross-language catalog of AMD GPU/NPU platform facts"
authors = [
    { name = "Matt Elliott", email = "matt.elliott@amd.com" }
]
requires-python = ">=3.12"
dependencies = [
    "docutils>=0.21",
    "requests>=2.32",
    "jsonschema>=4.23",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pyyaml>=6.0",
    "ruff>=0.16",
]
docs = [
    "rocm-docs-core>=1.40.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

