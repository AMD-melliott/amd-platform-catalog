[project]
name = "amd-platform-catalog"
version = "0.1.0"
description = "Versioned, cross-language catalog of AMD GPU/NPU platform facts"
authors = [
    { name = "Matt Elliott", email = "matt.elliott@amd.com" }
]
requires-python = ">=3.12"
dependencies = [
    "docutils>=0.21",
    "requests>=2.32",
    "jsonschema>=4.23",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pyyaml>=6.0",
    "ruff>=0.16",
]
docs = [
    "sphinx>=8.0",
    "myst-parser>=4.0",
    "furo>=2024.8",
    "linkify-it-py>=2.0",
    "sphinx-design>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# Deliberately broad: this is a diagnostic probe hitting brand-new,
# experimental hardware/software combinations (fp4/fp6/fp8 dtypes on a
# GPU generation PyTorch doesn't officially support yet) -- it must
# report *any* failure as a result, not crash on an exception type this
# module didn't anticipate.
"tools/hardware_validation/validate_precision_support.py" = ["BLE001"]

